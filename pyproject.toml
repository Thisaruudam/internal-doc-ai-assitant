[project]
name = "atrium"
version = "0.1.0"
description = "Enterprise AI assistant over organizational knowledge — multi-agent, retrieval-grounded, RBAC-enforced"
requires-python = ">=3.12,<3.13"

dependencies = [
    # ── API surface ────────────────────────────────────────────────
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "sse-starlette>=3.4",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "python-multipart>=0.0.12",

    # ── AuthN / AuthZ ──────────────────────────────────────────────
    "pyjwt[crypto]>=2.13",
    # bcrypt directly rather than via passlib: passlib 1.7.4 reads
    # bcrypt.__about__, which bcrypt 5.x removed, so the pairing raises on first
    # hash. The bcrypt API we need is two functions wide.
    "bcrypt>=5.0",

    # ── Agent orchestration ────────────────────────────────────────
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.1",
    "langchain-core>=1.5",
    "langchain-google-genai>=4.3",
    "google-genai>=2.18",
    "langsmith>=0.11",

    # ── Retrieval ──────────────────────────────────────────────────
    "pinecone>=9.1",
    "bm25s>=0.3",
    "PyStemmer>=3.1",

    # ── Tools ──────────────────────────────────────────────────────
    "mcp>=2.0",
    "pandas>=3.0",
    "numpy>=2.5",

    # ── Infrastructure ─────────────────────────────────────────────
    "redis>=8.1",
    "psycopg[binary,pool]>=3.3",
    "httpx>=0.28",
    "tenacity>=9.1",
    "structlog>=26.1",
    "pyyaml>=6.0",
    "orjson>=3.11",
]

[project.optional-dependencies]
# Installed only in the Streamlit image; the API image does not need it.
ui = [
    "streamlit>=1.61",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = [
    "S101",  # assert — used throughout the test suite
    "B008",  # function call in default arg — FastAPI Depends() idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # hardcoded test credentials are intentional
# The injection detector and its tests deliberately contain homoglyphs,
# zero-width characters, and full-width forms: they are the attack being
# detected. RUF001-003 flag exactly the input this code exists to handle.
"app/security/injection.py" = ["RUF001", "RUF002", "RUF003"]
"app/security/quarantine.py" = ["RUF001", "RUF002", "RUF003"]
"tests/security/test_injection.py" = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires live Pinecone / Gemini / Postgres",
    "security: prompt-injection and authorization suites",
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["bm25s.*", "Stemmer.*", "pinecone.*"]
ignore_missing_imports = true
